name = "hemp-discord-bot"
main = "src/index.js"
compatibility_date = "2026-03-10"
compatibility_flags = ["nodejs_compat"]
account_id = "75620f084ea25ade5ee57a71a830bba2"

# Cron triggers (UTC) — CDT = UTC-5
# 6am CDT = 11:00 UTC | 8am CDT = 13:00 UTC
# Note: shifts 1hr in winter (CST = UTC-6)
[triggers]
crons = ["0 11 * * *"]

# KV namespace for storing research data
[[kv_namespaces]]
binding = "HEMP_KV"
id = "67da35153de6428ab360bd415cc1e0c1"

# Secrets (set via: wrangler secret put <NAME>)
# - DISCORD_TOKEN
# - DISCORD_PUBLIC_KEY
# - DISCORD_APPLICATION_ID
# - DISCORD_TEST_CHANNEL_ID
# - DISCORD_TEST_GUILD_ID
# - TOGETHER_API_KEY
